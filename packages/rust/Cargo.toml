[package]
name = "agent-transcripts"
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Kevin Scott <me@thekevinscott.com>"]
repository = "https://github.com/thekevinscott/agent-transcripts"
description = "Capture coding-agent transcripts to disk and expose them as SQL."

[lib]
name = "agent_transcripts"
path = "src/lib.rs"

[[bin]]
name = "agent-transcripts"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
