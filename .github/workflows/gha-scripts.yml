name: Workflow scripts

# Lint + test the repo-internal CI CLI that backs our GitHub Actions
# workflows. CI logic lives in the `ci` package at ci/ (with colocated
# tests) instead of inline `run:` blocks, so it is runnable and testable
# locally — `just gha-lint` runs the inline-script gate, `just gha-test`
# runs the unit tests. The gate (`ci lint-workflow-scripts`) fails the
# build if a workflow grows a non-trivial inline script. See
# docs/internals/repo.md.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'ci/**'

permissions:
  contents: read

jobs:
  scripts:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Gate — no inline scripts in workflow YAML
        run: uv run --project ci ci lint-workflow-scripts
      - name: Test workflow scripts
        run: uv run pytest
        working-directory: ci
