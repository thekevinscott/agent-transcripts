[putitoutthere]
version = 1

# Three artifacts, one binary. Python ships a maturin-built wheel per
# target; npm ships a top-level package + per-platform sub-packages.
# Cascade: edits under packages/rust/** retrigger PyPI + npm builds.

[[package]]
name = "agent-transcripts-rust"
kind = "crates"
crate = "agent-transcripts"
path = "packages/rust"
first_version = "0.0.1"
globs = [
  "packages/rust/**",
  "LICENSE",
]

[[package]]
name = "agent-transcripts-py"
kind = "pypi"
pypi = "agent-transcripts"
path = "packages/python"
first_version = "0.0.1"
build = "maturin"
depends_on = ["agent-transcripts-rust"]
globs = [
  "packages/python/**",
  "packages/rust/**",
  "LICENSE",
]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[[package]]
name = "agent-transcripts-npm"
kind = "npm"
npm = "agent-transcripts"
path = "packages/node"
first_version = "0.0.1"
build = [{ mode = "bundled-cli", name = "@agent-transcripts/{triple}" }]
depends_on = ["agent-transcripts-rust"]
globs = [
  "packages/node/**",
  "packages/rust/**",
  "LICENSE",
]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

# #3: the engine cross-compiles the per-target binaries. That stamps the crate
# version before `cargo build` (write-crate-version), which building them from
# packages/node/scripts/build.mjs did not — every npm binary through 0.0.2
# reported the previous release's version. Linux rows also go through
# cargo-zigbuild against a pinned glibc 2.17 floor.
[package.bundle_cli]
bin = "agent-transcripts"
crate_path = "packages/rust"
